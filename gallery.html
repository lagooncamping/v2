<body data-page="gallery" data-root="">
  <main class="page">
    <section>
      <div class="wrap">
        <div class="head">
          <span class="eyebrow">บรรยากาศจริง</span>
          <h1>เช้าริมน้ำ เย็นดูพระอาทิตย์ตก</h1>
          <p>กดที่รูปเพื่อดูภาพขยาย</p>
        </div>
        <div class="gallery">
          <figure class="big"><img src="img/bell-tent.jpg" alt="เต็นท์กระโจมพร้อมโต๊ะและตะเกียงริมทะเลสาบ" loading="lazy"><figcaption>ลานเต็นท์ริมทะเลสาบ</figcaption></figure>
          <figure><img src="img/kayak.jpg" alt="พายเรือแคนูในทะเลสาบ" loading="lazy"><figcaption>พายแคนู</figcaption></figure>
          <figure><img src="img/lake-view.jpg" alt="ทะเลสาบน้ำใสใต้ร่มไม้ใหญ่" loading="lazy"><figcaption>วิวทะเลสาบ</figcaption></figure>
          <figure class="wide"><img src="img/sup.jpg" alt="ยืนพายบอร์ดในทะเลสาบ" loading="lazy"><figcaption>SUP บอร์ด</figcaption></figure>
          <figure class="wide"><img src="img/houses.jpg" alt="บ้านพักไม้ใต้ถุนสูงกลางสวน" loading="lazy"><figcaption>โซนบ้านพัก</figcaption></figure>
          <figure><img src="img/rooftop.jpg" alt="รถติดเต็นท์หลังคาจอดริมทะเลสาบ" loading="lazy"><figcaption>สายเต็นท์หลังคารถ</figcaption></figure>
          <figure><img src="img/night.jpg" alt="ลานแคมป์ยามค่ำคืนประดับไฟ" loading="lazy"><figcaption>ยามค่ำคืน</figcaption></figure>
          <figure class="wide"><img src="img/tent-field.jpg" alt="เต็นท์หลายหลังบนลานหญ้าริมทะเลสาบ" loading="lazy"><figcaption>ลานกว้างริมน้ำ</figcaption></figure>
          <figure class="wide"><img src="img/tents-lawn.jpg" alt="เต็นท์ริมทะเลสาบใต้ท้องฟ้าสดใส" loading="lazy"><figcaption>ฟ้าใส ริมทะเลสาบ</figcaption></figure>
          <figure class="wide"><img src="img/sunset.jpg" alt="พระอาทิตย์ตกสะท้อนผิวน้ำริมทะเลสาบ" loading="lazy"><figcaption>พระอาทิตย์ตก</figcaption></figure>
          <figure><img src="img/kettle.jpg" alt="กาต้มน้ำบนโต๊ะแคมป์ ฉากหลังเป็นทะเลสาบ" loading="lazy"><figcaption>จิบกาแฟริมน้ำ</figcaption></figure>
          <figure><img src="img/swings.jpg" alt="ชิงช้าไม้ริมทะเลสาบ" loading="lazy"><figcaption>ชิงช้าริมน้ำ</figcaption></figure>
          <figure class="wide"><img src="img/house-veranda.jpg" alt="ระเบียงบ้านพักไม้มองเห็นสนามหญ้า" loading="lazy"><figcaption>ระเบียงบ้านพัก</figcaption></figure>
          <figure class="wide"><img src="img/sign.jpg" alt="ป้ายไม้ชื่อเดอะ ลากูน แคมป์ปิ้ง รีสอร์ท" loading="lazy"><figcaption>ยินดีต้อนรับ</figcaption></figure>
        </div>

        <div class="next">
          <p>ชอบบรรยากาศแบบนี้? ดูที่พักแล้วจองได้เลย · ติดตามรูปใหม่ได้ที่ <a href="https://www.instagram.com/thelagooncampingresort" target="_blank" rel="noopener">Instagram</a></p>
          <div class="btns">
            <a class="btn btn-ghost" href="rooms.html">ดูที่พัก &amp; ราคา</a>
            <a class="btn btn-primary" href="booking.html">จองที่พัก</a>
          </div>
        </div>
      </div>
    </section>
  </main>
