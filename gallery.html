<body data-page="gallery" data-root="">
  <main class="page">
    <section>
      <div class="wrap">
        <div class="head">
          <span class="eyebrow">บรรยากาศจริง</span>
          <h1>เช้าริมน้ำ เย็นดูพระอาทิตย์ตก</h1>
          <p>กดที่รูปเพื่อดูภาพขยาย</p>
        </div>
        <div class="gallery">
          <figure class="big"><img src="img/bell-tent.jpg" alt="เต็นท์ใต้ต้นไม้ใหญ่ริมทะเลสาบ" loading="lazy"><figcaption>ลานเต็นท์ริมทะเลสาบ</figcaption></figure>
          <figure><img src="img/kayak.jpg" alt="พายเรือแคนูในทะเลสาบ" loading="lazy"><figcaption>พายแคนู</figcaption></figure>
          <figure><img src="img/lake-view.jpg" alt="วิวทะเลสาบน้ำสีฟ้าใต้ร่มไม้" loading="lazy"><figcaption>วิวทะเลสาบ</figcaption></figure>
          <figure class="wide"><img src="img/sup.jpg" alt="ยืนพายบอร์ดในทะเลสาบ" loading="lazy"><figcaption>SUP บอร์ด</figcaption></figure>
          <figure class="wide"><img src="img/houses.jpg" alt="บ้านพักไม้ท่ามกลางสนามหญ้าและกล้วยไม้" loading="lazy"><figcaption>โซนบ้านพัก</figcaption></figure>
          <figure><img src="img/rooftop.jpg" alt="รถติดเต็นท์หลังคาจอดริมทะเลสาบ" loading="lazy"><figcaption>สายเต็นท์หลังคารถ</figcaption></figure>
          <figure><img src="img/night.jpg" alt="ลานแคมป์ยามค่ำคืนประดับไฟ" loading="lazy"><figcaption>ยามค่ำคืน</figcaption></figure>
          <figure class="wide"><img src="img/tent-field.jpg" alt="เต็นท์หลายหลังบนลานหญ้าริมน้ำ" loading="lazy"><figcaption>ลานกว้าง มีที่จอดรถ</figcaption></figure>
          <figure class="wide"><img src="img/tents-lawn.jpg" alt="ลานเต็นท์ยามเช้าริมทะเลสาบ" loading="lazy"><figcaption>เช้าที่ลานเต็นท์</figcaption></figure>
          <figure class="wide"><img src="img/sunset.jpg" alt="พระอาทิตย์ตกเหนือทะเลสาบ" loading="lazy"><figcaption>พระอาทิตย์ตกริมน้ำ</figcaption></figure>
          <figure class="wide"><img src="img/glamping.jpg" alt="เต็นท์ริมทะเลสาบยามเช้า" loading="lazy"><figcaption>เต็นท์ให้เช่า</figcaption></figure>
        </div>

        <div class="next">
          <p>ชอบบรรยากาศแบบนี้? ดูที่พักแล้วจองได้เลย · ติดตามรูปใหม่ได้ที่ <a href="https://www.instagram.com/thelagooncampingresort" target="_blank" rel="noopener">Instagram</a></p>
          <div class="btns">
            <a class="btn btn-ghost" href="rooms.html">ดูที่พัก &amp; ราคา</a>
            <a class="btn btn-primary" href="booking.html">จองที่พัก</a>
          </div>
        </div>
      </div>
    </section>
  </main>
